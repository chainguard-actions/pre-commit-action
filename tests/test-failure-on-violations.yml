name: Test pre-commit fails on violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up pre-commit config and bad test file
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/pre-commit-config-failure/.pre-commit-config.yaml" \
             "$GITHUB_WORKSPACE/.pre-commit-config.yaml"
          printf 'hello world   \n' > "$GITHUB_WORKSPACE/bad-file.txt"
      - id: pre-commit
        uses: .
        with:
          extra_args: 'trailing-whitespace --files bad-file.txt'
        continue-on-error: true
      - name: Assert pre-commit failed due to violations
        env:
          OUTCOME: ${{ steps.pre-commit.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: pre-commit correctly failed on file with trailing whitespace"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: pre-commit should have failed on file with trailing whitespace"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Clean up
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/.pre-commit-config.yaml"
          rm -f "$GITHUB_WORKSPACE/bad-file.txt"
